name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
      - run: npm test
      - run: npm run build
      - run: node scripts/package-connector.mjs
      - run: node scripts/test-connector-package.mjs
        env:
          PANEL_TEST_VOICE_SETUP: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: connector-${{ matrix.os }}
          path: release/vibe-connector-*.zip
          if-no-files-found: error
      - if: runner.os == 'Linux'
        run: python3 deploy/test-release.py

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  cli-compatibility:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        versions:
          - { codex: '0.152.0', claude: '2.1.265' }
          - { codex: '0.153.4', claude: '2.1.266' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install official pinned CLIs
        run: npm install --global @openai/codex@${{ matrix.versions.codex }} @anthropic-ai/claude-code@${{ matrix.versions.claude }}
      - name: Real CLI session persistence and resume
        run: node scripts/test-real-cli.mjs

  windows-terminal:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false node-pty@1.1.0 @xterm/headless@6.0.0
      - run: npm install --global @openai/codex@0.153.4 @anthropic-ai/claude-code@2.1.266
      - name: Interactive Windows terminal ownership and handoff
        run: node scripts/test-real-cli.mjs
        env:
          PANEL_TEST_INTERACTIVE_TERMINAL: '1'

  linux-terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y lsof
      - run: npm install --no-save --package-lock=false node-pty@1.1.0 @xterm/headless@6.0.0
      - run: npm install --global @openai/codex@0.153.4 @anthropic-ai/claude-code@2.1.266
      - name: Interactive Linux terminal ownership and remote release
        run: node scripts/test-real-cli.mjs
        env:
          PANEL_TEST_INTERACTIVE_TERMINAL: '1'

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, browser-acceptance, cli-compatibility, windows-terminal, linux-terminal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: relay-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: connector-*
          path: connector-packages
          merge-multiple: true
      - name: Build versioned image and release package
        run: |
          docker build -f Dockerfile.relay --build-arg VERSION="$GITHUB_SHA" -t "vibe-panel:$GITHUB_SHA" .
          docker save "vibe-panel:$GITHUB_SHA" | gzip > relay-image.tar.gz
          for target in darwin-arm64 darwin-x64 win32-x64 linux-x64; do
            test -s "connector-packages/vibe-connector-$target.zip"
          done
          cp connector-packages/*.zip .
          sha256sum relay-image.tar.gz vibe-connector-*.zip > SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "relay-$GITHUB_SHA" >/dev/null 2>&1; then exit 0; fi
          previous=$(gh release view --json tagName --jq .tagName)
          python3 scripts/release-notes.py --revision "$GITHUB_SHA" --previous "$previous" --output release-notes.md
          gh release create "relay-$GITHUB_SHA" relay-image.tar.gz vibe-connector-*.zip SHA256SUMS --target "$GITHUB_SHA" --title "Vibe Panel 0.1.0 · ${GITHUB_SHA:0:8}" --notes-file release-notes.md --latest
      - name: Regional deployment handoff
        run: echo 'Release published. Deploy the immutable revision to the regional hosts, then run Verify deployed product.'
