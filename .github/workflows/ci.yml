name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance
      - run: npm test
      - run: npm run build
      - run: node scripts/package-connector.mjs
      - run: node scripts/test-connector-package.mjs
        env:
          PANEL_TEST_VOICE_SETUP: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: connector-${{ matrix.os }}
          path: release/vibe-connector-*.zip
          if-no-files-found: error
      - if: runner.os == 'Linux'
        run: python3 deploy/test-release.py

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: relay-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: connector-*
          path: connector-packages
          merge-multiple: true
      - name: Build versioned image and release package
        run: |
          docker build -f Dockerfile.relay --build-arg VERSION="$GITHUB_SHA" -t "vibe-panel:$GITHUB_SHA" .
          docker save "vibe-panel:$GITHUB_SHA" | gzip > relay-image.tar.gz
          for target in darwin-arm64 darwin-x64 win32-x64 linux-x64; do
            test -s "connector-packages/vibe-connector-$target.zip"
          done
          cp connector-packages/*.zip .
          sha256sum relay-image.tar.gz vibe-connector-*.zip > SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "relay-$GITHUB_SHA" >/dev/null 2>&1; then exit 0; fi
          gh release create "relay-$GITHUB_SHA" relay-image.tar.gz vibe-connector-*.zip SHA256SUMS --target "$GITHUB_SHA" --title "Vibe Panel $GITHUB_SHA" --notes "Portable Connector packages include Node 24 and locked dependencies. Extracted-package startup, pairing and task acceptance passed without global Node/npm on macOS Apple Silicon/Intel, Windows x64 and Linux x64. See START-HERE.md for prerequisites and known beta limitations. SHA256SUMS covers all downloads. Relay production updates automatically with health checks and rollback. Feedback: https://github.com/x2v-co/vibe-coding-panel/issues" --latest
      - name: Verify production applied this version
        run: |
          for attempt in $(seq 1 60); do
            version=$(curl -fsS --max-time 15 "https://vibe.tooluse.app/healthz?release=$GITHUB_SHA" | jq -r '.version' || true)
            if [ "$version" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo 'Production did not reach the expected version; inspect updater logs and rollback state.'
          exit 1
