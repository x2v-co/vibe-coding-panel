name: Verify deployed product
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full deployed release Git SHA
        required: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify actual website and regional Relay deployments
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: node scripts/verify-production.mjs "$EXPECTED_REVISION" https://vibe.toolkit.fun https://vibe-relay-cn.toolkit.fun https://vibe-relay-global.toolkit.fun
