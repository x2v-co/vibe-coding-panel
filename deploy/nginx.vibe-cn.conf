# Install as a separate template beside Toolkit's existing nginx template.
# Publicly trusted certificates are required; Cloudflare Origin CA is not valid
# for DNS-only/direct browser access. Never replace Toolkit's existing cert.
server {
    listen 80;
    server_name vibe.toolkit.fun vibe-relay-cn.toolkit.fun;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vibe.toolkit.fun vibe-relay-cn.toolkit.fun;
    ssl_certificate /etc/nginx/certs/vibe/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vibe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    resolver 127.0.0.11 valid=15s;
    set $vibe_backend http://vibe-regional:8789;
    location / {
        proxy_pass $vibe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 60s;
    }
}
