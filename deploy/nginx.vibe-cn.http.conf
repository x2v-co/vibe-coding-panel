# Certificate bootstrap only. Replace with nginx.vibe-cn.conf after issuance.
server {
    listen 80;
    server_name vibe.toolkit.fun vibe-relay-cn.toolkit.fun;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
