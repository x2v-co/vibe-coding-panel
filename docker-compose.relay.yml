services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    environment:
      PANEL_RELAY_HOST: 0.0.0.0
      PANEL_RELAY_PORT: 8789
      PANEL_RELAY_PUBLIC_URL: https://${PANEL_RELAY_DOMAIN}
      PANEL_RELAY_MAX_CONNECTORS: ${PANEL_RELAY_MAX_CONNECTORS:-100}
      PANEL_RELAY_MAX_INFLIGHT: ${PANEL_RELAY_MAX_INFLIGHT:-100}
      PANEL_RELAY_MAX_UPLOADS: ${PANEL_RELAY_MAX_UPLOADS:-8}
      PANEL_RELAY_RATE_LIMIT: ${PANEL_RELAY_RATE_LIMIT:-120}
      PANEL_RELAY_PAIR_LIMIT: ${PANEL_RELAY_PAIR_LIMIT:-10}
      PANEL_RELAY_MAX_BODY_BYTES: ${PANEL_RELAY_MAX_BODY_BYTES:-10485760}
      PANEL_RELAY_REQUEST_TIMEOUT_MS: ${PANEL_RELAY_REQUEST_TIMEOUT_MS:-60000}
      PANEL_RELAY_STREAM_TIMEOUT_MS: ${PANEL_RELAY_STREAM_TIMEOUT_MS:-600000}
      PANEL_RELAY_PER_CONNECTOR_INFLIGHT: ${PANEL_RELAY_PER_CONNECTOR_INFLIGHT:-20}
      PANEL_RELAY_ADMISSION_MODE: ${PANEL_RELAY_ADMISSION_MODE:-open}
      PANEL_RELAY_PER_CONNECTOR_RATE_LIMIT: ${PANEL_RELAY_PER_CONNECTOR_RATE_LIMIT:-180}
      PANEL_RELAY_PER_CONNECTOR_UPLOAD_LIMIT: ${PANEL_RELAY_PER_CONNECTOR_UPLOAD_LIMIT:-30}
      # Anonymous daily metrics, connection events and alerts (docs/relay-metrics.md). Empty values keep them off.
      PANEL_RELAY_METRICS_DIR: ${PANEL_RELAY_METRICS_DIR:-}
      PANEL_RELAY_METRICS_SALT: ${PANEL_RELAY_METRICS_SALT:-}
      PANEL_RELAY_METRICS_TOKEN: ${PANEL_RELAY_METRICS_TOKEN:-}
      PANEL_RELAY_EVENT_RETENTION_DAYS: ${PANEL_RELAY_EVENT_RETENTION_DAYS:-30}
      PANEL_RELAY_REGION: ${PANEL_RELAY_REGION:-}
      PANEL_RELAY_ALERT_TG_BOT_TOKEN: ${PANEL_RELAY_ALERT_TG_BOT_TOKEN:-}
      PANEL_RELAY_ALERT_TG_CHAT_ID: ${PANEL_RELAY_ALERT_TG_CHAT_ID:-}
      PANEL_RELAY_ALERT_WEBHOOK: ${PANEL_RELAY_ALERT_WEBHOOK:-}
      PANEL_RELAY_ALERT_PROXY: ${PANEL_RELAY_ALERT_PROXY:-}
      PANEL_RELAY_ALERT_WINDOW_MIN: ${PANEL_RELAY_ALERT_WINDOW_MIN:-10}
      PANEL_RELAY_ALERT_ABNORMAL_RATIO: ${PANEL_RELAY_ALERT_ABNORMAL_RATIO:-0.3}
      PANEL_RELAY_ALERT_CONNECT_FAIL_RATIO: ${PANEL_RELAY_ALERT_CONNECT_FAIL_RATIO:-0.3}
      PANEL_RELAY_ALERT_MIN_EVENTS: ${PANEL_RELAY_ALERT_MIN_EVENTS:-10}
      PANEL_RELAY_ALERT_COOLDOWN_MIN: ${PANEL_RELAY_ALERT_COOLDOWN_MIN:-60}
    volumes:
      - relay_metrics:/data/metrics
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8789"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8789/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      PANEL_RELAY_DOMAIN: ${PANEL_RELAY_DOMAIN:?set PANEL_RELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  relay_metrics:
  caddy_data:
  caddy_config:
